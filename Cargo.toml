[workspace]
resolver = "2"
members = [
    "crates/apex-core",
    "crates/apex-protocol",
    "crates/apex-models",
    "crates/apex-tools",
    "crates/apex-memory",
    "crates/apex-agent",
    "crates/apex-verification",
    "crates/apex-runtime",
    "crates/apex-cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/apex-ai/apex"
rust-version = "1.99"

[workspace.dependencies]
apex-core = { path = "crates/apex-core" }
apex-protocol = { path = "crates/apex-protocol" }
apex-models = { path = "crates/apex-models" }
apex-tools = { path = "crates/apex-tools" }
apex-memory = { path = "crates/apex-memory" }
apex-agent = { path = "crates/apex-agent" }
apex-verification = { path = "crates/apex-verification" }
apex-runtime = { path = "crates/apex-runtime" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures = "0.3"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
